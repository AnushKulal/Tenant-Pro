name: Publish OTA Update

# Pushes an over-the-air (EAS Update) build whenever the mobile app changes.
# Installed apps pick it up via the in-app "Update available" popup — no rebuild,
# no Play Store, no waiting. Needs one repo secret: EXPO_TOKEN.
#
# ── Why there is no `paths:` filter here ─────────────────────────────────────
#
# There used to be one: `paths: ['mobile/**']`, so that backend-only pushes did
# not publish an app update. It worked for months and then quietly did not. A
# push to main changing 13 files under mobile/ created no run at all — the Pages
# workflow fired for the same commit, so the push was seen; this one simply was
# not started. The release had to be published by hand, and nothing anywhere
# said why. A path filter that mis-evaluates does not fail, it is SILENT, and a
# release mechanism whose failure mode is silence is one you cannot trust.
#
# So the trigger is now every push to main, and the "did the app actually
# change?" question is answered in the job below by git, where the answer is
# printed in the log and can be read afterwards. A backend-only push costs about
# twenty seconds of runner time to decide to do nothing, which is the price of
# the decision being visible.
#
# The decision deliberately errs towards publishing: if the range cannot be
# worked out (a new branch, a force push, a commit missing from the checkout) it
# publishes. A redundant update is a no-op for the phone; a missed one is a
# release that silently did not happen, which is the bug this replaced.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message shown in the app'
        required: false
        default: 'Latest fixes and improvements'

# Two pushes in quick succession must not publish at the same time: whichever
# finished last would win, and that is not necessarily the newer one. Queue
# rather than cancel — a half-finished publish is worse than a slow one.
concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Need history so the changelog script can read commit subjects.
          fetch-depth: 0

      # What the `paths:` filter used to do, done where it can be seen. Prints
      # its reasoning either way, so a run that published nothing says so in one
      # line rather than looking like a run that went wrong.
      - name: Decide whether the app changed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          decide() {
            if [ "$EVENT" != "push" ]; then
              echo "yes|run by hand"; return
            fi
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "yes|no previous commit to compare against"; return
            fi
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "yes|previous commit $BEFORE_SHA is not in this checkout"; return
            fi
            if git diff --quiet "$BEFORE_SHA" HEAD -- mobile; then
              echo "no|nothing under mobile/ changed"
            else
              echo "yes|$(git diff --name-only "$BEFORE_SHA" HEAD -- mobile | wc -l) file(s) under mobile/ changed"
            fi
          }
          OUT=$(decide)
          PUBLISH="${OUT%%|*}"
          WHY="${OUT#*|}"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Publishing: $PUBLISH  ($WHY)"
          echo "### OTA: publish = \`$PUBLISH\` — $WHY" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: steps.decide.outputs.publish == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        if: steps.decide.outputs.publish == 'yes'
        run: npm install -g eas-cli

      - name: Install dependencies
        if: steps.decide.outputs.publish == 'yes'
        working-directory: mobile
        run: npm install

      # Turn this patch's real commit subjects into the "What's new" notes that
      # the in-app update sheet displays. Writes app.json → extra.releaseNotes,
      # which travels inside the update manifest.
      - name: Generate changelog from this patch
        if: steps.decide.outputs.publish == 'yes'
        working-directory: mobile
        env:
          # Via env, not inline ${{ }} — see the note on the publish step below.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BEFORE="$BEFORE_SHA"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/set-changelog.js "$BEFORE..HEAD"
          else
            node scripts/set-changelog.js
          fi
          echo "--- app.json extra ---"
          node -e "console.log(JSON.stringify(require('./app.json').expo.extra, null, 2))"

      - name: Publish OTA update
        if: steps.decide.outputs.publish == 'yes'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # MUST match the build profiles' API URL. Without this the OTA bundle
          # would fall back to a LAN IP and the app couldn't reach the backend.
          EXPO_PUBLIC_API_URL: https://tenantpro-backend.onrender.com
          # The map tile provider. EXPO_PUBLIC_* values are inlined into the bundle
          # at export time, so a key that only lives in a local .env never reaches an
          # OTA update — the map would silently fall back to the development tile
          # server. From repo secrets, so the key is never committed.
          #
          # Unset is survivable, not fatal: the app falls back to OpenStreetMap's own
          # servers, which work but are not licensed for a distributed app. Add the
          # secrets and the next update picks them up.
          # Defaults to maptiler so there is only ONE thing to paste: the key.
          # The provider NAME is not a secret — it is the word "maptiler" — and
          # asking for it in a box labelled "Secret" invites pasting the key there
          # instead. Set the secret only to switch to another provider.
          EXPO_PUBLIC_MAP_PROVIDER: ${{ secrets.EXPO_PUBLIC_MAP_PROVIDER || 'maptiler' }}
          EXPO_PUBLIC_MAP_KEY: ${{ secrets.EXPO_PUBLIC_MAP_KEY }}
          EXPO_PUBLIC_MAP_TILE_URL: ${{ secrets.EXPO_PUBLIC_MAP_TILE_URL }}
          EXPO_PUBLIC_MAP_TILE_URL_DARK: ${{ secrets.EXPO_PUBLIC_MAP_TILE_URL_DARK }}
          EXPO_PUBLIC_MAP_ATTRIBUTION: ${{ secrets.EXPO_PUBLIC_MAP_ATTRIBUTION }}
          # Commit messages and workflow inputs are arbitrary text. Interpolating
          # ${{ ... }} straight into the script body pastes that text into the
          # shell, so a multi-line message — or one containing a quote — breaks
          # the script (and would let a crafted message run commands). Passing
          # them as env vars and referencing "$VAR" keeps them as data.
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="$INPUT_MESSAGE"
          if [ -z "$MSG" ]; then MSG="$COMMIT_MESSAGE"; fi
          # An EAS update message is a single line, so keep only the subject.
          MSG=$(printf '%s\n' "$MSG" | head -n 1)
          if [ -z "$MSG" ]; then MSG="Update"; fi
          echo "Publishing with message: $MSG"
          # Publish to BOTH channels so it reaches sideloaded "preview" APKs
          # (what's installed today) and future "production" Play Store builds.
          eas update --branch preview --message "$MSG" --non-interactive
          eas update --branch production --message "$MSG" --non-interactive
