name: Publish OTA Update

# Pushes an over-the-air (EAS Update) build whenever the mobile app changes.
# Installed apps pick it up via the in-app "Update available" popup — no rebuild,
# no Play Store, no waiting. Needs one repo secret: EXPO_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message shown in the app'
        required: false
        default: 'Latest fixes and improvements'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Need history so the changelog script can read commit subjects.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      # Turn this patch's real commit subjects into the "What's new" notes that
      # the in-app update sheet displays. Writes app.json → extra.releaseNotes,
      # which travels inside the update manifest.
      - name: Generate changelog from this patch
        working-directory: mobile
        env:
          # Via env, not inline ${{ }} — see the note on the publish step below.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BEFORE="$BEFORE_SHA"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/set-changelog.js "$BEFORE..HEAD"
          else
            node scripts/set-changelog.js
          fi
          echo "--- app.json extra ---"
          node -e "console.log(JSON.stringify(require('./app.json').expo.extra, null, 2))"

      - name: Publish OTA update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # MUST match the build profiles' API URL. Without this the OTA bundle
          # would fall back to a LAN IP and the app couldn't reach the backend.
          EXPO_PUBLIC_API_URL: https://tenantpro-backend.onrender.com
          # The map tile provider. EXPO_PUBLIC_* values are inlined into the bundle
          # at export time, so a key that only lives in a local .env never reaches an
          # OTA update — the map would silently fall back to the development tile
          # server. From repo secrets, so the key is never committed.
          #
          # Unset is survivable, not fatal: the app falls back to OpenStreetMap's own
          # servers, which work but are not licensed for a distributed app. Add the
          # secrets and the next update picks them up.
          EXPO_PUBLIC_MAP_TILE_URL: ${{ secrets.EXPO_PUBLIC_MAP_TILE_URL }}
          EXPO_PUBLIC_MAP_TILE_URL_DARK: ${{ secrets.EXPO_PUBLIC_MAP_TILE_URL_DARK }}
          EXPO_PUBLIC_MAP_ATTRIBUTION: ${{ secrets.EXPO_PUBLIC_MAP_ATTRIBUTION }}
          # Commit messages and workflow inputs are arbitrary text. Interpolating
          # ${{ ... }} straight into the script body pastes that text into the
          # shell, so a multi-line message — or one containing a quote — breaks
          # the script (and would let a crafted message run commands). Passing
          # them as env vars and referencing "$VAR" keeps them as data.
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="$INPUT_MESSAGE"
          if [ -z "$MSG" ]; then MSG="$COMMIT_MESSAGE"; fi
          # An EAS update message is a single line, so keep only the subject.
          MSG=$(printf '%s\n' "$MSG" | head -n 1)
          if [ -z "$MSG" ]; then MSG="Update"; fi
          echo "Publishing with message: $MSG"
          # Publish to BOTH channels so it reaches sideloaded "preview" APKs
          # (what's installed today) and future "production" Play Store builds.
          eas update --branch preview --message "$MSG" --non-interactive
          eas update --branch production --message "$MSG" --non-interactive
