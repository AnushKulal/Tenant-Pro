name: Build Android APK

# Run this manually from the Actions tab (Run workflow). It builds the APK on
# GitHub's free runners using EAS "local" mode — no Expo build queue.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Link EAS project (creates/links project ID non-interactively)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli init --non-interactive

      - name: Build APK (EAS local — bypasses the Expo queue)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >
          npx eas-cli build
          --platform android
          --profile preview
          --local
          --non-interactive
          --output ${{ github.workspace }}/tenantpro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenantpro-apk
          path: tenantpro.apk
          if-no-files-found: error
