name: Build Android APK

# Run this manually from the Actions tab (Run workflow). It builds the APK on
# GitHub's free runners using EAS "local" mode — no Expo build queue.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # fail fast instead of hanging for hours
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-tenantpro
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Build APK (EAS local — bypasses the Expo queue)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"   # use the working dir directly; avoids CI git hangs
        run: >
          npx eas-cli build
          --platform android
          --profile preview
          --local
          --non-interactive
          --output ${{ github.workspace }}/tenantpro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenantpro-apk
          path: tenantpro.apk
          if-no-files-found: error
