name: Build Android APK

# Run this manually from the Actions tab (Run workflow) — pick the branch.
# Builds the APK ON THE RUNNER with `eas build --local`, which does NOT consume
# the EAS cloud build quota (used when the hosted queue is exhausted). Gradle is
# given extra heap/metaspace and the daemon is disabled to fit the runner, and
# the timeout is raised to 90m. Publishes the APK as a Release + artifact.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-tp-v2
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Build APK (EAS local — no cloud quota)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          # The map provider, same as eas-update.yml passes. These were missing here,
          # and eas.json additionally overrode them with the literal text
          # "$EXPO_PUBLIC_MAP_TILE_URL" — EAS does not shell-expand env values, so the
          # placeholder itself was compiled into the APK. Tiles were then fetched from
          # a URL that is not a URL, so an installed build showed an empty map while
          # the same code shipped over the air worked: eas-update.yml passed the real
          # values, so only the APK was affected. Both halves are fixed; keep this list
          # in step with eas-update.yml.
          EXPO_PUBLIC_MAP_PROVIDER: ${{ secrets.EXPO_PUBLIC_MAP_PROVIDER || 'maptiler' }}
          EXPO_PUBLIC_MAP_KEY: ${{ secrets.EXPO_PUBLIC_MAP_KEY }}
          EXPO_PUBLIC_MAP_TILE_URL: ${{ secrets.EXPO_PUBLIC_MAP_TILE_URL }}
          EXPO_PUBLIC_MAP_TILE_URL_DARK: ${{ secrets.EXPO_PUBLIC_MAP_TILE_URL_DARK }}
          EXPO_PUBLIC_MAP_ATTRIBUTION: ${{ secrets.EXPO_PUBLIC_MAP_ATTRIBUTION }}
          # Give Gradle room on the 7 GB runner and disable the daemon (lower
          # overhead) — the earlier failure was an OutOfMemoryError: Metaspace.
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx5120m -XX:MaxMetaspaceSize=2g"
          # These also flow into the app's android/gradle.properties JVM args via
          # Expo prebuild's passthrough of ORG_GRADLE_PROJECT_* is not used here;
          # daemon-off means GRADLE_OPTS applies to the build JVM directly.
        run: >
          npx eas-cli build
          --platform android
          --profile preview
          --local
          --non-interactive
          --output ${{ github.workspace }}/tenantpro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tenantpro-apk
          path: tenantpro.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TenantPro Android (build ${{ github.run_number }})
          body: "Download **tenantpro.apk** below and open it on your Android phone to install."
          files: tenantpro.apk
          make_latest: true
