# Render Blueprint for the TenantPro backend.
# In Render: New + -> "Blueprint" -> connect this repo. Render reads this file,
# creates the web service, then prompts you to fill in the env vars marked below.
#
# NOTE: Render does not offer managed MySQL, so the database lives on a separate
# provider (Aiven / Railway / PlanetScale). Put its credentials in the DB_* vars.
services:
  - type: web
    name: tenantpro-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Render sets PORT automatically — do not hard-code it.
      - key: BASE_URL
        sync: false   # e.g. https://tenantpro-backend.onrender.com
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong random secret
      # Cloudinary keeps uploaded images alive across redeploys (recommended).
      - key: CLOUDINARY_URL
        sync: false
      # Email over HTTPS. Free web services BLOCK outbound SMTP ports (25/465/587),
      # so the EMAIL_*/SMTP_* variables below cannot work on the free plan — they
      # time out. Set one API key instead; see backend/DEPLOY.md.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      # Pin the provider while migrating between two keys. Optional.
      - key: MAIL_PROVIDER
        sync: false
      # Must be an address verified with the provider above, or it refuses the send.
      - key: MAIL_FROM
        sync: false
      # SMTP fallback — only usable on a paid instance type.
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
